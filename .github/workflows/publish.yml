# Publishes to npm with provenance when a version tag is pushed.
#
# Auth: npm OIDC Trusted Publishing (no NPM_TOKEN). One-time setup on npmjs.com:
#   package settings -> Trusted Publishers -> Add publisher -> GitHub Actions
#     Repository owner:  sfrangulov
#     Repository name:   n8n-nodes-docx-to-md
#     Workflow filename: publish.yml
#
# Release flow:
#   npm version <patch|minor|major>   # bumps package.json + creates a git tag
#   git push && git push --tags       # pushing the tag triggers this workflow
name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      # OIDC Trusted Publishing requires npm >= 11.5; runners ship npm 10.
      - run: npm install -g npm@latest
      # prepublishOnly runs build + lint; provenance is signed via OIDC.
      - run: npm publish --provenance --access public

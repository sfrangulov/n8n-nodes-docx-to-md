# Publishes to npm with provenance when a version tag is pushed.
#
# This repo uses pnpm (pnpm-lock.yaml) for installs, but publishes via npm:
# OIDC Trusted Publishing requires npm >= 11.5 (shipped with Node 24).
#
# Auth: npm OIDC Trusted Publishing (no NPM_TOKEN). One-time setup on npmjs.com:
#   n8n-nodes-docx-to-md settings -> Trusted Publishers -> GitHub Actions
#     Repository owner:  sfrangulov
#     Repository name:   n8n-nodes-docx-to-md
#     Workflow filename: publish.yml
#
# Release flow:
#   npm version <patch|minor|major> && git push --follow-tags
name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs build + lint; publish via npm for OIDC provenance.
      - run: npm publish --provenance --access public
